<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:var(--font)/1.55 "Microsoft YaHei","PingFang SC",sans-serif}button,select,input{font:inherit}button,select{min-height:38px;border:1px solid #bccabd;border-radius:6px;padding:6px 10px;color:var(--ink);background:var(--panel)}button{cursor:pointer}button:hover:not(:disabled),select:hover{background:var(--green-soft)}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.primary:hover{background:#154f3c}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d99c58;outline-offset:3px}h1,h2,p,pre{margin:0}h1{font:600 27px/1.1 "STKaiti","KaiTi",serif;letter-spacing:1px}h2{font-size:16px;font-weight:600}code,.tabular-nums{font-family:var(--mono);font-variant-numeric:tabular-nums}.topbar{position:sticky;top:0;z-index:5;background:#faf9f2f5;border-bottom:1px solid #ccd6c9;backdrop-filter:blur(10px)}.toolbar{max-width:1550px;margin:auto;padding:13px 24px;display:flex;align-items:center;flex-wrap:wrap;gap:9px}.toolbar h1{margin-right:12px}.toolbar select{max-width:290px}.toolbar label{display:flex;gap:6px;align-items:center}.toolbar .speed-label{color:var(--muted);font-size:12px}.toolbar #ft-count{color:var(--muted);font-size:12px;white-space:nowrap}.content{max-width:1550px;margin:auto;padding:18px 24px 26px;display:grid;gap:14px}.lesson-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.lesson-bar #ft-m{font-weight:600;color:var(--green)}.seekline{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px}.seekline input{margin:0;width:100%;accent-color:var(--green);height:12px}.seekline span{font:12px var(--mono);color:var(--muted)}.current{display:flex;gap:20px;align-items:center;justify-content:space-between;background:var(--green);color:#fffef5;border-radius:9px;padding:16px 20px;min-height:90px}.current h2{font-size:20px;margin-bottom:4px}.current p{color:#e3eddf;font-size:14px}.current.fail{background:#954d34}.current small{color:#d8e9d7;font-family:var(--mono);white-space:nowrap}.stage-path{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted);font-size:13px}.stage-path span{padding-bottom:4px;border-bottom:2px solid transparent}.stage-path .active{color:var(--green);font-weight:600;border-bottom-color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(350px,1fr);align-items:start;gap:16px}.left,.right{display:grid;gap:14px;min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;min-width:0}.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}.small{font-size:12px;color:var(--muted)}.ft-orders{display:flex;gap:12px}.ft-order{flex:1;padding:11px 15px;background:#e9ece3;border-left:3px solid transparent;font-size:13px}.ft-order[data-active="true"]{background:var(--green-soft);border-color:var(--green);color:#25593f}.ft-order .order-name{font-weight:600;display:block;font-size:15px;margin-bottom:3px}.ft-order .remaining{display:inline-block;margin-left:9px;color:var(--orange);font-weight:600}.ft-axis{position:relative;height:25px;margin-left:70px;margin-right:1px;font:12px var(--mono);color:var(--muted)}.ft-tick{position:absolute;transform:translateX(-50%)}.ft-tick:first-child{transform:none}.ft-tick:last-child{transform:translateX(-100%)}.ft-lane{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;margin-bottom:11px;font-weight:600}.ft-track{position:relative;height:48px;background:repeating-linear-gradient(90deg,#f0f1e8 0,#f0f1e8 calc(20% - 1px),#dce3d7 calc(20% - 1px),#dce3d7 20%)}.ft-bar{position:absolute;top:5px;bottom:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;font:600 17px var(--mono);color:var(--ink);transition:left .25s,width .25s,opacity .25s}.ft-load{background:#9dc6ad}.ft-trip{background:#e9 nt p,.large .ft-formulas{font-size:18px}.large .ft-car code{font-size:15px}.large .panel-head .small{font-size:13px}.large h2{font-size:18px}
@media(min-width:1600px){.content{gap:17px}.panel{padding:20px 22px}.ft-track{height:56px}.ft-code{font-size:16px}.current p{font-size:16px}.ft-formulas{font-size:17px}.ft-car code{font-size:15px}}
@media(min-width:1100px) and (max-width:1599px){
 .toolbar{padding:10px 18px}.content{padding:12px 18px 18px;gap:10px}

 .current h2{font-size:18px;margin-bottom:2px}.current p{font-size:13px}
 .stage-path{font-size:12px}.layout{gap:12px}.left,.right{gap:10px}
 .panel{padding:12px 14px}.panel-head{margin-bottom:8px}.panel-head h2{font-size:15px}
 .ft-track{height:37px}.ft-lane{margin-bottom:7px}.ft-axis{height:22px}
 .ft-bar{font-size:15px}.ft-legend{margin-top:6px;font-size:11px}
 .ft-order{padding:8px 12px;font-size:12px}.ft-order .order-name{display:inline-block;font-size:14px;margin:0 10px 0 0}
 .ft-car{padding:7px 4px;gap:3px}.ft-car .car-name{font-size:12px}
 .ft-car .car-name code{font-size:11px;margin-left:3px}.ft-car .free-time{font-size:25px;line-height:1.15}
 .ft-car .car-hint{font-size:11px}.vars .var{padding:6px 8px}.vars strong{font-size:23px}
 .ft-formulas{font-size:14px;gap:6px}.ft-code{font-size:13px;line-height:1.6}
 .code-purpose{padding-top:7px;margin-top:7px;font-size:11px}
 .large .ft-code{font-size:16px}.large .ft-formulas{font-size:18px}
}
@media(max-width:1000px){.toolbar{padding:12px 16px}.content{padding:14px 16px}.layout{grid-template-columns:minmax(0,1fr) minmax(315px,.95fr)}.panel{padding:14px}.ft-cars{grid-template-columns:repeat(2,minmax(0,1fr))}.current small{display:none}}
@media(max-width:740px){.layout{grid-template-columns:minmax(0,1fr)}.toolbar{gap:7px}.toolbar h1{width:100%;margin-bottom:3px}.toolbar select{max-width:100%}.current{padding:14px 16px}.current h2{font-size:18px}.ft-orders{flex-direction:column;gap:7px}.stage-path{gap:6px 14px}.ft-cars{grid-template-columns:repeat(4,minmax(0,1fr))}.ft-car code{font-size:11px}.panel-head{flex-wrap:wrap}.ft-formulas{font-size:14px}}
@media(max-width:420px){.content{padding:12px}.toolbar{padding:10px 12px}.toolbar #ft-case{width:100%}.ft-cars{grid-template-columns:repeat(2,minmax(0,1fr))}.vars{grid-template-columns:repeat(2,minmax(0,1fr))}.ft-car code{font-size:13px}.current{min-height:110px}.ft-lane{grid-template-columns:55px minmax(0,1fr)}.ft-axis{margin-left:55px}.ft-track{height:43px}.ft-bar{font-size:14px}.ft-legend{gap:8px}.lesson-bar{gap:7px 15px}}

<body>
<div id="forklift-t7">
  <header class="topbar"><div class="toolbar">
    <h1>叉车调度</h1>
    <select id="ft-case" aria-label="选择题中数据">
      <option value="figure">题图 · 22 件、12 件，4 辆车</option>
      <option value="three">第（1）问 · 15 件、12 件，3 辆车</option>
      <option value="two">第（1）问 · 15 件、12 件，2 辆车</option>
      <option value="binary">第（1）问 · 二分 1～4 辆车</option>
    </select>
    <button id="ft-prev" type="button">上一步</button><button id="ft-next" class="primary" type="button">下一步</button>
    <button id="ft-play" type="button">播放</button><button id="ft-reset" type="button">重新开始</button>
    <label class="speed-label">速度<select id="ft-speed" aria-label="播放速度"><option value="1800">慢速</option><option value="1000" selected>常速</option><option value="350">快速</option></select></label>
    <button id="ft-large" type="button" aria-pressed="false">大字模式</button><span id="ft-count"></span>
  </div></header>
  <main class="content">
    <div class="lesson-bar"><span id="ft-m"></span><span>每次最多装 <b>10 件</b></span><span>搬运用时 <b>3</b></span><span>截止时刻 <b>15</b></span></div>
    <div class="seekline"><input id="ft-seek" type="range" min="0" value="0" aria-label="演示进度"><span id="ft-round"></span></div>
    <section class="current" id="ft-banner" aria-live="polite"><div><h2 id="ft-stage"></h2><p id="ft-detail"></p></div><small>当前代码块执行后</small></section>
    <div id="ft-phases" class="stage-path" aria-label="本轮处理流程"></div>
    <div class="layout">
      <div class="left">
        <div id="ft-orders" class="ft-orders"></div>
        <section class="panel">
          <div class="panel-head"><h2>装货与搬运时间安排</h2><span class="small">按程序推算 · 横轴为时间</span></div>
          <div role="img" aria-label="各车的装货和搬运安排" id="ft-timeline"></div>
          <div class="ft-legend"><span><i class="ft-swatch ft-load"></i>装货 · 数字为件数</span><span><i class="ft-swatch ft-trip"></i>搬运</span><span>淡色为本轮拟安排</span></div>
        </section>
        <section class="panel"><div class="panel-head"><h2>cars · 各车下次空闲时间</h2><span class="small">车号从 1 起，数组下标从 0 起</span></div><div class="ft-cars tabular-nums" id="ft-cars"></div></section>
        <div id="ft-search" class="search tabular-nums" hidden></div>
      </div>
      <div class="right">
        <section class="panel"><div class="panel-head"><h2>本轮关键变量</h2></div><div class="vars" id="ft-vars"></div></section>
        <section class="panel"><div class="panel-head"><h2>代入计算</h2></div><div id="ft-formulas" class="ft-formulas"></div></section>
        <section class="panel code-panel"><div class="panel-head"><h2>当前代码块</h2><span class="small" id="ft-code-phase"></span></div><pre class="ft-code"><code id="ft-code"></code></pre><div id="ft-purpose" class="code-purpose"></div></section>
      </div>
    </div>
  </main>
</div>
<script>
(function startForklift() {
  const root = document.getElementById('forklift-t7');
  if (!root) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startForklift, { once: true });
    } else {
      const observer = new MutationObserver(() => {
        if (document.getElementById('forklift-t7')) {
          observer.disconnect();
          startForklift();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    }
    return;
  }
  if (root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';
  const el = name => root.querySelector('#ft-' + name);
  const cases = {
    figure: { data: [[0,22],[4,12]], m: 4 },
    three: { data: [[0,15],[4,12]], m: 3 },
    two: { data: [[0,15],[4,12]], m: 2 },
    binary: { data: [[0,15],[4,12]], m: 4, binary: true }
  };
  const code = {
    init: 'cars = [0] * m',
    order: 'for i in range(len(data)):\n    count = data[i][1]',
    loop: 'while count > 0:',
    scan: 'def findi(cars):\n    mini = 0\n    for j in range(len(cars)):\n        if cars[j] < cars[mini]:\n            mini = j\n    return mini',
    start: 'mini = findi(cars)\nstime = max(cars[mini], data[i][0])',
    remain: 'remain = t - 3 - stime\nif remain <= 0:\n    return False',
    load: 'load = min(count, remain, v)',
    update: 'cars[mini] = stime + load + 3\ncount -= load',
    finish: 'return True',
    binary: 'm = (left + right) // 2\nif check(data, m, v, t):\n    right = m - 1\nelse:\n    left = m + 1',
    answer: 'if left > n:\n    print("订单无法完成！")\nelse:\n    print("最少需要", left, "辆叉车")'
  };

  function build(config) {
    const steps = [];
    let left = 1, right = config.m;
    const history = [];
    let state;
    function emit(phase, title, detail) {
      steps.push(JSON.parse(JSON.stringify({ ...state, phase, title, detail, left, right, history })));
    }
    function check(m) {
      state = { m, data: config.data, cars: Array(m).fill(0), jobs: [], preview: null,
        i: -1, round: 0, count: null, mini: null, inspect: null, stime: null,
        remain: null, load: null, formulas: [], result: null };
      emit('init', '初始化叉车', `${m} 辆叉车的下次空闲时间均为 0。`);
      for (let i = 0; i < config.data.length; i++) {
        const [release, quantity] = config.data[i];
        Object.assign(state, { i, count: quantity, mini: null, inspect: null,
          stime: null, remain: null, load: null, preview: null, formulas: [] });
        emit('order', `处理订单 ${i + 1}`, `订单装货时间为 ${release}，本单共 ${quantity} 件。`);
        while (state.count > 0) {
          state.round++;
          Object.assign(state, { mini: null, inspect: null, stime: null, remain: null,
            load: null, preview: null, formulas: [] });
          emit('loop', '检查本单是否搬完', `count = ${state.count} > 0，本轮需要再安排一次搬运。`);
          state.mini = 0;
          for (let j = 0; j < m; j++) {
            if (state.cars[j] < state.cars[state.mini]) state.mini = j;
          }
          state.inspect = null;
          const minimum = state.cars[state.mini];
          const tied = state.cars.flatMap((value, car) => value === minimum ? [car + 1] : []);
          state.formulas = [
            `cars = [${state.cars.join(', ')}]`,
            `最早空闲时间 = ${minimum}，mini = ${state.mini}`
          ];
          emit('scan', '一次找出最早空闲的车',
            tied.length > 1
              ? `${tied.join('、')} 号车同为 ${minimum} 时空闲，选编号最小的 ${state.mini + 1} 号车。`
              : `${state.mini + 1} 号车最早空闲，下次空闲时间为 ${minimum}。`);
          const free = state.cars[state.mini];
          state.stime = Math.max(free, release);
          state.formulas = [`stime = max(${free}, ${release}) = ${state.stime}`];
          emit('start', `选中 ${state.mini + 1} 号车 · 比较开始时间`,
            free < release ? `车在 ${free} 时空闲，等待订单至 ${release} 才能装货。`
            : free > release ? `订单在 ${release} 时可装货，等车空闲至 ${free} 才能开始。`
            : `车辆空闲与订单装货时刻均为 ${free}，立即开始。`);
          state.remain = 15 - 3 - state.stime;
          state.formulas.push(`remain = 15 - 3 - ${state.stime} = ${state.remain}`);
          if (state.remain <= 0) {
            state.result = false;
            emit('remain', '本次 check 返回 False',
              `最早空闲车也没有装货时间，本单还剩 ${state.count} 件，无法按时完成。`);
            return false;
          }
          emit('remain', '扣除搬运时间', `距截止时刻先预留 3 单位搬运时间，可用于装货的时间为 ${state.remain}。`);
          state.load = Math.min(state.count, state.remain, 10);
          state.formulas.push(`load = min(${state.count}, ${state.remain}, 10) = ${state.load}`);
          const limiting = [];
          if (state.load === state.count) limiting.push('待搬货物数');
          if (state.load === state.remain) limiting.push('剩余装货时间');
          if (state.load === 10) limiting.push('单次容量');
          state.preview = { car: state.mini, order: i, start: state.stime,
            load: state.load, end: state.stime + state.load + 3 };
          emit('load', '比较本次装货量', `由${limiting.join('、')}限制，本次装 ${state.load} 件。淡色显示本轮拟安排。`);
          const oldCount = state.count;
          state.cars[state.mini] = state.preview.end;
          state.count -= state.load;
          state.jobs.push(state.preview);
          state.preview = null;
          state.formulas = [
            `cars[${state.mini}] = ${state.stime} + ${state.load} + 3 = ${state.cars[state.mini]}`,
            `count = ${oldCount} - ${state.load} = ${state.count}`
          ];
          emit('update', '更新空闲时间与剩余件数',
            `${state.mini + 1} 号车空闲时间 ${free} → ${state.cars[state.mini]}；订单剩余 ${oldCount} → ${state.count} 件。`);
        }
        state.formulas = [`count = 0 → count > 0 为 False`];
        emit('loop', `订单 ${i + 1} 安排完毕`, i + 1 < config.data.length ? '退出本单 while 循环，读取下一订单。' : '全部订单均已安排，准备返回 True。');
      }
      state.result = true;
      state.mini = null;
      state.formulas = [];
      emit('finish', '本次 check 返回 True', `${m} 辆叉车可在截止时间 15 以内完成全部订单。`);
      return true;
    }
    if (config.binary) {
      while (left <= right) {
        const m = Math.floor((left + right) / 2);
        const ok = check(m);
        const before = `[${left}, ${right}]`;
        history.push({ m, ok });
        if (ok) right = m - 1;
        else left = m + 1;
        state.formulas = [`m = ${m}，check = ${ok ? 'True' : 'False'}`, `区间 ${before} → [${left}, ${right}]`];
        emit('binary', '更新二分区间', ok ? `尝试更少的车，right = ${m} - 1 = ${right}。` : `增加车辆，left = ${m} + 1 = ${left}。`);
      }
      state.formulas = [`left = ${left}，right = ${right}，left > right`];
      emit('answer', `最少需要 ${left} 辆叉车`, '二分循环结束，left 为最小可行叉车数量。');
    } else check(config.m);
    return steps;
  }

  let caseId = 'figure';
  let frames = build(cases[caseId]);
  let index = 0;
  let timer = null;
  const escaped = text => String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

  function bar(job, preview) {
    const start = job.start / 15 * 100;
    const loading = job.load / 15 * 100;
    const moving = 3 / 15 * 100;
    const attr = `订单 ${job.order + 1}，装 ${job.load} 件，${job.start} 开始，${job.end} 完成`;
    return `<div class="ft-bar ft-load ${preview ? 'ft-preview' : ''}" style="left:${start}%;width:${loading}%" title="${attr}">${job.load}</div>` +
      `<div class="ft-bar ft-trip ${preview ? 'ft-preview' : ''}" style="left:${start + loading}%;width:${moving}%" title="${attr}">运</div>`;
  }

  function render() {
    const s = frames[index];
    el('case').value = caseId;
    el('count').textContent = `${index + 1} / ${frames.length}`;
    el('seek').max = frames.length - 1;
    el('seek').value = index;
    el('prev').disabled = index === 0;
    el('next').disabled = index === frames.length - 1;
    el('play').textContent = timer ? '暂停' : index === frames.length - 1 ? '重播' : '播放';
    el('round').textContent = s.round ? `while 第 ${s.round} 轮` : '初始化';
    el('m').textContent = `本次 check · m = ${s.m} 辆`;
    el('orders').innerHTML = s.data.map(([release,quantity],i) =>
      `<div class="ft-order" data-active="${s.i === i}"><span class="order-name">订单 ${i+1}</span>装货时刻 ${release} · ${quantity} 件${s.i === i && s.count !== null ? `<span class="remaining">待搬 ${s.count} 件</span>` : ''}</div>`).join('');
    el('stage').textContent = s.title;
    el('detail').textContent = s.detail;
    const formulas = s.formulas.length ? s.formulas : s.phase === 'init'
      ? [`cars = [${s.cars.join(', ')}]`]
      : s.phase === 'order' ? [`count = data[${s.i}][1] = ${s.count}`]
      : s.phase === 'loop' ? [`count = ${s.count}`]
      : ['全部订单均已安排完成'];
    el('formulas').innerHTML = formulas.map(f => `<div class="ft-formula">${escaped(f)}</div>`).join('');
    el('banner').classList.toggle('fail', s.result === false && s.phase === 'remain');
    el('vars').innerHTML = ['mini','stime','remain','load'].map(key =>
      `<div class="var" data-key="${key}"><label>${key}</label><strong>${s[key] === null ? '—' : s[key]}</strong></div>`).join('');
    const phases = [['scan','找最早车'],['start','比较开始时间'],['remain','预留搬运时间'],['load','比较装货量'],['update','更新状态']];
    el('phases').innerHTML = phases.map(([phase,label]) =>
      `<span class="${s.phase === phase ? 'active' : ''}">${label}</span>`).join('');
    const purposes = {
      init:'{ 初始化所有叉车的空闲时间 }', order:'{ 读取当前订单的待搬件数 }',
      loop:'{ 当前订单还有货物时，继续安排搬运 }',
      scan:'{ 一次完成最早空闲车的查找，同值保留较小编号 }',
      start:'{ 等待车辆和订单都就绪 }', remain:'{ 在截止前预留 3 单位搬运时间 }',
      load:'{ 同时满足待搬件数、剩余时间和单次容量 }',
      update:'{ 记录下次空闲时间，扣除已安排的货物 }',
      finish:'{ 所有订单均可在截止时间前完成 }',
      binary:'{ 根据当前车辆数是否可行，继续缩小二分区间 }',
      answer:'{ 输出最少需要的叉车数量 }'
    };
    el('purpose').textContent = purposes[s.phase];
    el('code-phase').textContent = s.phase === 'scan' ? 'findi(cars)' : s.phase === 'binary' || s.phase === 'answer' ? '二分主程序' : 'check(data, m, v, t)';
    el('code').textContent = code[s.phase];
    el('cars').innerHTML = s.cars.map((time,i) =>
      `<div class="ft-car" data-candidate="${s.mini === i}"><span class="car-name">${i+1} 号车 <code>cars[${i}]</code></span><strong class="free-time">${time}</strong><span class="car-hint">${s.mini === i ? '本轮选中' : '下次空闲时间'}</span></div>`).join('');
    const axis = [0,3,6,9,12,15].map(t => `<span class="ft-tick text-small" style="left:${t/15*100}%">${t}</span>`).join('');
    el('timeline').innerHTML = `<div class="ft-axis">${axis}</div>` + s.cars.map((_,i) =>
      `<div class="ft-lane"><span>${i+1} 号车</span><div class="ft-track">${s.jobs.filter(j => j.car === i).map(j => bar(j,false)).join('')}${s.preview && s.preview.car === i ? bar(s.preview,true) : ''}<span class="ft-deadline"></span></div></div>`).join('');
    el('timeline').setAttribute('aria-label', `${s.jobs.length} 次已安排搬运，截止时刻 15；数字表示装货件数，运表示搬运阶段`);
    el('search').hidden = !cases[caseId].binary;
    el('search').innerHTML = `<span>二分区间 [${s.left}, ${s.right}]</span><span>${s.history.length ? s.history.map(h => `${h.m} 辆 ${h.ok ? '可行' : '不可行'}`).join('　') : '开始检查中点车辆数'}</span>`;
  }

  function save() {
    try {
      localStorage.setItem('forklift-dispatch-v2', JSON.stringify({
        privateContent: { caseId, index, speed: el('speed').value }
      }));
    } catch (_) { /* The lesson also works when browser storage is unavailable. */ }
  }
  function pause() {
    if (timer !== null) clearInterval(timer);
    timer = null;
  }
  function move(next) {
    pause();
    index = Math.max(0,Math.min(frames.length-1,next));
    render();
    save();
  }
  function restore(saved) {
    const data = saved?.privateContent;
    if (!data || !cases[data.caseId]) return;
    pause();
    caseId = data.caseId;
    frames = build(cases[caseId]);
    index = Number.isInteger(data.index) ? Math.max(0,Math.min(frames.length-1,data.index)) : 0;
    if (['1800','1000','350'].includes(data.speed)) el('speed').value = data.speed;
  }
  el('prev').onclick = () => move(index-1);
  el('next').onclick = () => move(index+1);
  el('reset').onclick = () => move(0);
  el('seek').oninput = event => move(Number(event.target.value));
  el('speed').onchange = () => { pause();render();save(); };
  el('case').onchange = event => {
    pause();caseId = event.target.value;frames = build(cases[caseId]);index = 0;render();save();
  };
  el('play').onclick = () => {
    if (timer !== null) { pause();render();save();return; }
    if (index === frames.length-1) index = 0;
    timer = setInterval(() => {
      index = Math.min(frames.length-1,index+1);
      if (index === frames.length-1) { pause();save(); }
      render();
    },Number(el('speed').value));
    render();save();
  };
  root.addEventListener('keydown',event => {
    if (['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName)) return;
    if (event.key === 'ArrowRight') { event.preventDefault();move(index+1); }
    if (event.key === 'ArrowLeft') { event.preventDefault();move(index-1); }
  });
  el('large').onclick = () => {
    const active = root.classList.toggle('large');
    el('large').setAttribute('aria-pressed', String(active));
  };
  try { restore(JSON.parse(localStorage.getItem('forklift-dispatch-v2'))); } catch (_) {}
  render();
})();
</script>
</body>
</html>

<script id="model">
'use strict';
const DiffModel = (() => {
 const cases = {
  bridge:[{name:'教学示例 · 中间一段加2',a:[1,2,3,4,5],L:1,R:3,x:2},{name:'教学示例 · 左端开始加3',a:[1,2,3,4,5],L:0,R:2,x:3},{name:'教学示例 · 单个位置减2',a:[1,2,3,4,5],L:2,R:2,x:-2}],
  add:[{name:'原题C · 两段重叠',a:[1,2,3,4,5],ops:[[0,3,2],[1,1,4]]},{name:'原题D · 右端到最后一项',a:[1,2,3,4,5],ops:[[0,4,4],[2,3,4]]},{name:'原题A · 两次都加0',a:[1,2,3,4,5],ops:[[0,4,0],[2,3,0]]}],
  merge:[{name:'原题第(1)问 · 六个区间',intervals:[[5,12],[1,4],[8,15],[20,25],[18,22],[25,35]]}]
 };
 const clone = x => JSON.parse(JSON.stringify(x));
 function prefix(raw,n=raw.length){let s=0;return raw.slice(0,n).map((delta,i)=>{let before=s;s+=delta;return {i,before,delta,after:s};});}
 function difference(b){return b.map((v,i)=>v-(i?b[i-1]:0));}
 function add(a,ops){
  const raw=Array(a.length+1).fill(0),events=[];
  for(let k=0;k<ops.length;k++){const [L,R,x]=ops[k],leftBefore=raw[L],rightBefore=raw[R+1];raw[L]+=x;raw[R+1]-=x;events.push({k,L,R,x,leftBefore,leftAfter:raw[L],rightBefore,rightAfter:raw[R+1],raw:raw.slice()});}
  const trace=prefix(raw,a.length),increments=trace.map(t=>t.after),result=a.map((v,i)=>v+increments[i]);
  return {a:a.slice(),ops:clone(ops),raw,events,trace,increments,result,work:[...increments,raw[a.length]]};
 }
 function merge(intervals){
  const scale=2;
  const mx=Math.max(...intervals.map(t=>t[1])),raw=Array(mx*scale+2).fill(0),events=[];
  for(let k=0;k<intervals.length;k++){const [L,R]=intervals[k],l=L*scale,r=R*scale+1,lb=raw[l],rb=raw[r];raw[l]++;raw[r]--;events.push({k,L,R,l,r,lb,la:raw[l],rb,ra:raw[r],raw:raw.slice()});}
  const trace=[];let sum=0,start=-1,ans=[];
  for(let i=0;i<raw.length;i++){let before=sum,startBefore=start,appended=null;sum+=raw[i];let action='未覆盖，继续扫描';if(sum>0){if(start<0){start=i;action='首次覆盖，记下起点';}else{action='仍有覆盖，保持起点';}}else if(start>=0){appended=[Math.floor(start/scale),Math.floor(i/scale)];ans.push(appended);start=-1;action='覆盖归零，收下一段';}trace.push({i,before,delta:raw[i],after:sum,startBefore,startAfter:start,ans:clone(ans),appended,action});}
  return {intervals:clone(intervals),mx,raw,events,trace,ans,scale};
 }
 function bridge(c){const b=c.a.map((_,i)=>i>=c.L&&i<=c.R?c.x:0),raw=difference(b),trace=prefix(raw),restored=trace.map(t=>t.after);return {...clone(c),b,raw,trace,restored,result:c.a.map((v,i)=>v+restored[i])};}
 return {cases,clone,prefix,difference,add,merge,bridge};
})();
if(typeof window!=='undefined')window.DiffModel=DiffModel;
</script>

 const thoughts=[`区间数据：${list(intervals)}。先看它们在数轴上是否相连；放大位置不改变原来的连接关系。`,`所有区间都登记完毕。重叠处的覆盖数会叠加，但此刻 diff 仍只是“变化量”。`,`start 记的是放大后的下标，不是原始千米数。只有第一次从未覆盖进入覆盖时，才设置 start。`,`扫描结束，最后覆盖数回到0，start重置为−1。合并结果为 ${list(ans)}。覆盖数由2降到1时仍大于0，不能截断区间。`];setText('thought',thoughts[stage]);setText('result',stage===3?'合并结果 ans = '+list(ans):'');stats([['原区间数',String(intervals.length)],['整块执行后 sum_d',stage<2?'尚未扫描':'0'],['整块执行后 ans',stage>=2?list(stage===3?ans:[]):'尚未初始化','answer']]);setText('codeTitle','浙南原题 · 填空已补全');

 noteCards([['为什么这里要把位置乘2？','<p>看第（1）问的 <code>[1,4]</code> 与 <code>[5,12]</code>：4到5之间有空隙，应该分成两段。如果直接在整数下标4的下一格5取消，恰好又在5开始下一段，加减抵消，扫描就看不到空隙。</p><p>放大后：前一段在下标9退出，后一段到下标10才进入。下标9对应位置4.5，覆盖为0，因此能够分开。</p><p><code>[20,25]</code> 与 <code>[25,35]</code> 共享端点25，在下标50仍有覆盖，所以能连成一段；它们还会与 <code>[18,22]</code> 合并。</p>'],['退出时为什么 i//2 是右端点？','<p>某个合并区间的原始右端点为R，放大后为2R。它在下一格 <code>i=2R+1</code> 退出。</p><div class="equation">i // 2 = (2R+1) // 2 = R</div><p>例如合并后的右端点15，在下标31退出，<code>31//2=15</code>。因此③也可写成 <code>[start//2,(i-1)//2]</code>。</p>']]);quiz([['覆盖数从2降到1，要结束吗？','不结束。例如位置12.5处，覆盖数从2降到1，[8,15]仍在覆盖；只有覆盖数归零时才收下一段。'],['[1,4] 和 [5,12] 应该合并吗？','不合并。位置4.5没有覆盖；放大后下标9处的覆盖数为0。'],['三个合并区间分别来自哪里？','[1,4]独立；[5,12]与[8,15]合为[5,15]；[18,22]、[20,25]与[25,35]合为[18,35]。']]);
 if(stage===0){setText('detailTitle','先对照两种坐标');$('calculation').innerHTML='<p>偶数下标：原整数位置。奇数下标：相邻整数的中间位置。</p><div class="big-equation">位置 4, 4.5, 5<br>下标 8, 9, 10</div><p>用中间位置判断空隙；不会把原来相连的区间拆开。</p>';$('inspectNote').innerHTML='<p>直接展示第（1）问的全部六个区间，保留题目给出的顺序。</p><p>重点观察位置4.5的空隙、位置8～12的重叠，以及位置25的共享端点。</p>';$('ledger').innerHTML=table(['区间','进入下标 2L','最后覆盖下标 2R','退出下标 2R+1'],intervals.map(([L,R])=>[`[${L},${R}]`,2*L,2*R,2*R+1]));}
 else if(stage===1){const e=events[inspectIndex];setText('detailTitle','每个区间各贡献一层覆盖');$('calculation').innerHTML=`<p>第${e.k+1}个区间：[${e.L},${e.R}]</p><div class="big-equation">diff[${e.l}]：${e.lb} → ${e.la}<br>diff[${e.r}]：${e.rb} → ${e.ra}</div><p>从下标${e.l}进入，到下标${e.r}退出。</p>`;$('inspectNote').innerHTML='<p>多个区间可以在同一格登记，变化量直接相加。</p><p>先把所有区间登记完，再扫描一次。当前主图是全部登记完成后的状态。</p>';$('ledger').innerHTML=table(['区间','进入位置的旧值→新值','退出位置的旧值→新值'],events.map(e=>[`[${e.L},${e.R}]`,`diff[${e.l}] ${e.lb}→${e.la}`,`diff[${e.r}] ${e.rb}→${e.ra}`]),inspectIndex);}
 else if(stage===2){setText('detailTitle','扫描前，先理解三个变量');$('calculation').innerHTML='<p>① ans=[]：保存已经完整走出的合并区间。</p><div class="big-equation">sum_d = 0；start = −1</div><p>当前覆盖数为0；尚未进入任何一段覆盖区间。</p>';$('inspectNote').innerHTML='<p>sum_d 大于0时仍处于覆盖范围。</p><p>start≥0且sum_d变成0时，才有一段需要写入ans。</p>';$('ledger').innerHTML=table(['变量','初值','含义'],[['sum_d',0,'当前覆盖次数'],['start',-1,'当前合并段的放大后起点；−1表示无'],['ans','[]','已经结束并收下的合并区间']]);}
 else{const t=trace[inspectIndex];setText('detailTitle','扫描内部快照 · 覆盖数与答案同步变化');$('calculation').innerHTML=`<p>i=${t.i}，对应实际位置${t.i/2}</p><div class="big-equation">${t.before} + (${t.delta}) = ${t.after}</div><p>② ${t.after} > 0 为 ${t.after>0?'真':'假'}；${t.action}。</p><p class="small">start：${t.startBefore} → ${t.startAfter}；本轮后 ans=${esc(list(t.ans))}</p>`;$('inspectNote').innerHTML=t.appended?`<p>③此处收下区间：</p><p class="num">[${t.startBefore}//2, ${t.i}//2] = ${esc(list(t.appended))}</p><p>记录后 start 设回−1，准备寻找下一段。</p>`:t.after>0?`<p>${t.startBefore<0?'首次进入覆盖，记下 start='+t.startAfter+'。':'仍有覆盖，继续保留原起点 start='+t.startAfter+'。'}</p><p>ans 只在整段退出时追加，不能提前写入。</p>`:'<p>尚未处于覆盖范围，且没有待结束的区间。本轮只继续向后扫描。</p>';$('ledger').innerHTML=table(['下标 i','实际位置','累加前','diff[i]','sum_d','start 旧→新','动作 / 本轮后ans'],trace.map(t=>[t.i,t.i/2,t.before,t.delta,t.after,`${t.startBefore}→${t.startAfter}`,`${t.action} ${list(t.ans)}`]),inspectIndex);}
}
function followInspection(){const cell=$('arrays').querySelector('.picked');if(cell){const wrap=$('arrays');const a=cell.getBoundingClientRect(),b=wrap.getBoundingClientRect();wrap.scrollLeft=Math.max(0,wrap.scrollLeft+a.left-b.left-wrap.clientWidth/2+a.width/2);}else $('arrays').scrollLeft=0;const selected=$('ledger').querySelector('tr.selected');if(selected){const a=selected.getBoundingClientRect(),b=$('ledger').getBoundingClientRect();$('ledger').scrollTop=Math.max(0,$('ledger').scrollTop+a.top-b.top-$('ledger').clientHeight/2+a.height/2);}else $('ledger').scrollTop=0;}
function render(){fillInspector();if(mode==='bridge')renderBridge();else if(mode==='add')renderAdd();else renderMerge();setText('stageCount',`${stage} / ${lengths[mode]-1} 块${stage===lengths[mode]-1?' · 完成':''}`);$('progress').style.width=100*stage/(lengths[mode]-1)+'%';$('prev').disabled=stage===0;$('next').disabled=stage===lengths[mode]-1;$('play').textContent=timerKind==='stages'?'暂停演示':'自动演示';$('replay').textContent=timerKind==='inside'?'暂停回放':'回放循环内部';followInspection();}
function move(delta){stop();stage=Math.max(0,Math.min(lengths[mode]-1,stage+delta));inspectIndex=0;render();}
$('lesson').addEventListener('change',()=>{mode=$('lesson').value;setupCases();load();});$('case').addEventListener('change',()=>{caseIndex=Number($('case').value);load();});$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('reset').addEventListener('click',load);
$('inspect').addEventListener('change',()=>{stop();inspectIndex=Number($('inspect').value);render();});
$('large').addEventListener('click',()=>{const on=document.body.classList.toggle('big');$('large').setAttribute('aria-pressed',String(on));followInspection();});$('speed').addEventListener('change',stop);
$('play').addEventListener('click',()=>{if(timerKind==='stages'){stop();return;}stop();if(stage===lengths[mode]-1){stage=0;inspectIndex=0;}timerKind='stages';timer=setInterval(()=>{stage++;inspectIndex=0;if(stage>=lengths[mode]-1){stage=lengths[mode]-1;stop();}render();},Number($('speed').value));render();});
$('replay').addEventListener('click',()=>{if(timerKind==='inside'){stop();return;}stop();inspectIndex=0;const total=inspectorItems().length;if(!total)return;timerKind='inside';timer=setInterval(()=>{inspectIndex++;if(inspectIndex>=total){inspectIndex=total-1;stop();}render();},Number($('speed').value));render();});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
window.DiffLab={getState:()=>({mode,caseIndex,stage,inspectIndex,playing:timerKind,data:M.clone(data)})};
setupCases();load();
})();
